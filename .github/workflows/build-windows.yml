name: Build Windows release

# The installer requires Inno Setup, which only runs on Windows. A developer working on
# macOS can produce the executable locally with build/build.sh, but not the installer.
# This workflow closes that gap: it builds, tests, publishes and packages on a Windows
# runner and attaches the results to the run, so a signed-ready installer is always one
# push away.

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Runs first and on a cheaper runner. There is no point packaging a build whose
  # tests do not pass.
  # ---------------------------------------------------------------------------
  test:
    name: Test on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PdfToDicom.sln

      - name: Build
        # EnableWindowsTargeting lets the WPF project compile on a Linux runner.
        run: dotnet build PdfToDicom.sln -c Release --no-restore --nologo -p:EnableWindowsTargeting=true

      - name: Run the unit and workflow tests
        run: >-
          dotnet test tests/PdfToDicom.Core.Tests/PdfToDicom.Core.Tests.csproj
          -c Release --no-build --nologo --verbosity normal
          --logger "trx;LogFileName=test-results.trx"

      - name: Install DCMTK for the interoperability check
        run: sudo apt-get update && sudo apt-get install -y dcmtk

      - name: Verify interoperability against a reference DICOM archive
        # Proves that an independent, standards conformant implementation accepts the
        # generated object, which the unit tests cannot establish on their own.
        run: bash build/verify-against-dcmtk.sh 11112

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Produces the shippable artefacts.
  # ---------------------------------------------------------------------------
  package:
    name: Publish and package on Windows
    runs-on: windows-latest
    needs: test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PdfToDicom.sln

      - name: Publish the self contained executables
        run: .\build\build.ps1 -Task publish
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build the installer
        run: .\build\build.ps1 -Task package
        shell: pwsh

      - name: Confirm the executable is genuinely self contained
        # A published single file build that still expects a shared runtime would fail
        # on a clean hospital workstation, so the assumption is checked rather than
        # trusted. A size well above one hundred megabytes indicates the runtime is
        # embedded, and the file must be a valid PE image.
        run: |
          $exe = Get-Item artifacts\app\PdfToDicom.exe
          $sizeMb = [math]::Round($exe.Length / 1MB, 1)
          Write-Host "PdfToDicom.exe is $sizeMb MB"

          if ($exe.Length -lt 40MB) {
            throw "The executable is only $sizeMb MB, which suggests the .NET runtime was not embedded."
          }

          $header = [System.IO.File]::ReadAllBytes($exe.FullName)[0..1]
          if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
            throw 'The published file is not a valid Windows executable.'
          }

          Write-Host 'The executable is self contained and well formed.'
        shell: pwsh

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: PdfToDicom-installer
          path: artifacts/PdfToDicom-Setup-*.exe
          if-no-files-found: error

      - name: Upload the portable package
        uses: actions/upload-artifact@v4
        with:
          name: PdfToDicom-portable
          path: artifacts/PdfToDicom-portable.zip
          if-no-files-found: error

      - name: Upload the standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: PdfToDicom-exe
          path: artifacts/app/PdfToDicom.exe
          if-no-files-found: error
