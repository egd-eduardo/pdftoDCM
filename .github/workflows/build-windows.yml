name: Build Windows release

# The product targets Windows only, in its three architectures: 32 bit, 64 bit and ARM64.
#
# The installer requires Inno Setup, which only runs on Windows, so the packaging job runs
# on a Windows runner. The test job runs on Linux purely because it is faster and because
# the DICOM interoperability check needs DCMTK, which installs cleanly there. Nothing
# shipped to a user is produced on Linux.

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # ---------------------------------------------------------------------------
  # Runs first. There is no point packaging a build whose tests do not pass.
  # ---------------------------------------------------------------------------
  test:
    name: Test and verify interoperability
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # Both, and the order matters for why.
          #
          # 8.0.x supplies the runtime the tests execute on, since everything targets
          # net8.0. 10.0.x supplies a NuGet new enough to honour NuGetAuditSuppress,
          # which is how the five ImageSharp advisories are suppressed individually in
          # PdfToDicom.Core.csproj. NuGet 6.8, which ships with the 8.0 SDK, ignores
          # that item silently, so on 8.0 alone those five warnings reappear here while
          # a developer on a current SDK sees none. Same repository, different output,
          # which is the kind of difference that wastes an afternoon.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        # Restore generates assets for every runtime identifier declared in the project
        # files, so the Release build below succeeds without restoring again.
        run: dotnet restore "PDF to DICOM.sln"

      - name: Build
        # EnableWindowsTargeting lets the WPF project compile on a Linux runner.
        run: dotnet build "PDF to DICOM.sln" -c Release --no-restore -p:EnableWindowsTargeting=true

      - name: Run the unit and workflow tests
        # The whole solution rather than one named project. A second test project was added
        # for the integration engine, and naming projects here means the next one is one
        # forgotten line away from never being run, which is the kind of gap that is only
        # noticed when something it covered has already shipped.
        run: >-
          dotnet test "PDF to DICOM.sln"
          -c Release --no-build --verbosity normal
          --logger "trx;LogFileName=test-results.trx"

      - name: Validate the installer script
        # Inno Setup only runs on Windows, so a mistake here would otherwise surface
        # several minutes later in the packaging job as a bare line number. This static
        # check catches the common classes of error in seconds.
        run: python3 build/validate-installer-script.py

      - name: Validate the XAML bindings
        # WPF resolves bindings when a window loads, not when it compiles, so a broken
        # binding is a clean build and a crash on startup. The application cannot be run
        # on Linux, so these checks stand in for launching it.
        run: python3 build/validate-xaml-bindings.py

      - name: Validate the view model command refreshes
        # A command refreshed before it has been created throws in the constructor, so the
        # window will not open. It compiles cleanly, and it only shows at a site that has
        # the feature configured. This shipped once; it does not get to ship twice.
        run: python3 build/validate-viewmodel-commands.py

      - name: Validate the PowerShell count reads
        # Windows PowerShell under Set-StrictMode will not read .Count from a single
        # object, and a pipeline that emits one result assigns one object. PowerShell 7,
        # which is what this runner has, answers the same expression happily, so nothing
        # here can reproduce the fault; this check is the only thing that sees it.
        run: python3 build/validate-powershell-strict.py

      - name: Parse check the PowerShell scripts
        # These only run on the Windows job, so a syntax error in one would otherwise
        # cost a full Windows build to discover. PowerShell is present on the Linux
        # runner, so they are at least parsed here first.
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          $failed = 0

          foreach ($script in 'build/build.ps1', 'build/sign.ps1') {
            $errors = $null
            $tokens = $null

            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null

            if ($errors) {
              $errors | ForEach-Object {
                Write-Host "::error file=$script,line=$($_.Extent.StartLineNumber)::$($_.Message)"
              }
              $failed += $errors.Count
            }
            else {
              Write-Host "$script parses cleanly."
            }
          }

          if ($failed) { throw "$failed parse error(s) across the PowerShell scripts." }

      - name: Install DCMTK for the interoperability check
        run: sudo apt-get update && sudo apt-get install -y dcmtk

      - name: Verify interoperability against a reference DICOM archive and worklist
        # Proves that an independent, standards conformant implementation accepts the
        # generated object, which the unit tests cannot establish on their own. The same
        # script then drives the worklist client against DCMTK's own wlmscpfs, on the
        # next port up, for the same reason.
        run: bash build/verify-against-dcmtk.sh 11112

      - name: Verify the HL7 integration engine against an independent MLLP receiver
        # The counterpart to the DCMTK check, for the other protocol. It drives the command
        # line front end against a receiver written from the standard in the Python standard
        # library, so the engine is answering to something other than itself.
        #
        # It belongs here and not only in the pre-push list: it has found four defects that
        # the unit tests did not, two of them in the message control identifier and the
        # duplicate guard, which is the sort of thing that must not depend on somebody
        # remembering to run a script.
        #
        # No DCMTK, no HL7 library and no network: python3 and the SDK are enough.
        run: bash build/verify-hl7-interop.sh 32575

      - name: Upload test results
        if: always()
        # Keeping a copy of the results is a convenience; the test step above is what
        # decides whether the build is sound. Failing the whole pipeline because the
        # artifact could not be stored, which is what happens when the account's artifact
        # allowance is spent, hides a green test run behind a red tick and blocks
        # packaging. The step is still reported as failed when it fails.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Produces the shippable artefacts, one set per Windows architecture.
  # ---------------------------------------------------------------------------
  package:
    name: Package ${{ matrix.rid }}
    runs-on: windows-latest
    needs: test

    strategy:
      # One architecture failing should not hide whether the others are sound.
      fail-fast: false
      matrix:
        rid: [ win-x86, win-x64, win-arm64 ]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # Both, and the order matters for why.
          #
          # 8.0.x supplies the runtime the tests execute on, since everything targets
          # net8.0. 10.0.x supplies a NuGet new enough to honour NuGetAuditSuppress,
          # which is how the five ImageSharp advisories are suppressed individually in
          # PdfToDicom.Core.csproj. NuGet 6.8, which ships with the 8.0 SDK, ignores
          # that item silently, so on 8.0 alone those five warnings reappear here while
          # a developer on a current SDK sees none. Same repository, different output,
          # which is the kind of difference that wastes an afternoon.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Publish the self contained executables
        # -Cli because this is the build that reaches a site, and the handover package is
        # meant to carry the command line tool. A developer's build leaves it out, since
        # it is a second self contained publish and most of them have no use for it.
        #
        # One architecture per job, named explicitly: the script builds 64 bit and ARM
        # together by default, which is right at a desk and wrong in a matrix that already
        # runs one job per architecture.
        run: .\build\build.ps1 -Task publish -Runtimes ${{ matrix.rid }} -Cli
        shell: pwsh

      - name: Install Inno Setup
        # Version 6.3 or later is required for the architecture identifiers the script uses.
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build the installer
        run: .\build\build.ps1 -Task package -Runtimes ${{ matrix.rid }} -Cli
        shell: pwsh

      - name: Confirm the executable is genuinely self contained
        # A published single file build that still expects a shared runtime would fail on a
        # clean hospital workstation, so the assumption is checked rather than trusted.
        # A size well above forty megabytes indicates the runtime is embedded, and the file
        # must be a valid PE image for the requested architecture.
        run: |
          $rid = '${{ matrix.rid }}'
          $exe = Get-Item "artifacts\$rid\app\PdfToDicom.exe"
          $sizeMb = [math]::Round($exe.Length / 1MB, 1)
          Write-Host "PdfToDicom.exe ($rid) is $sizeMb MB"

          if ($exe.Length -lt 40MB) {
            throw "The executable is only $sizeMb MB, which suggests the .NET runtime was not embedded."
          }

          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)

          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'The published file is not a valid Windows executable.'
          }

          # The COFF machine type sits immediately after the PE signature, whose offset is
          # stored at 0x3C. Checking it proves the build really targeted this architecture
          # rather than silently falling back to the runner's own.
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine  = [BitConverter]::ToUInt16($bytes, $peOffset + 4)

          $expected = @{ 'win-x86' = 0x014C; 'win-x64' = 0x8664; 'win-arm64' = 0xAA64 }[$rid]

          if ($machine -ne $expected) {
            throw ("Expected machine type 0x{0:X4} for {1} but found 0x{2:X4}." -f $expected, $rid, $machine)
          }

          Write-Host ("The executable is self contained and targets {0} (machine 0x{1:X4})." -f $rid, $machine)
        shell: pwsh

      # One run of this matrix produces roughly 700 MB across the three architectures.
      # Artifact storage is charged against the whole account rather than this repository,
      # so keeping that for every push exhausted the allowance and blocked uploads
      # everywhere else. The shippable files are therefore stored when someone actually
      # needs them, which is a tagged release or a build asked for by hand, and they are
      # given a bounded life rather than the ninety day default. Ordinary pushes and pull
      # requests still build and verify all three architectures; they simply do not keep
      # the output.
      - name: Upload the installer
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: PdfToDicom-installer-${{ matrix.rid }}
          path: artifacts/PdfToDicom-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload the handover package
        # The FOLDER, not a zip of it. The build no longer makes a zip by default, because
        # the folder can be copied to a machine as it stands, and this step does not need
        # one: actions/upload-artifact archives whatever it is given, so uploading the zip
        # produced a zip inside a zip for anybody downloading it.
        #
        # A wildcard on the version, so a version bump does not break this step. The
        # installer upload above already works that way; this one did not, and a rename
        # of the package output broke the build until it was matched.
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: PdfToDicom-package-${{ matrix.rid }}
          path: artifacts/PdfToDicom-*-${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 7

      - name: Upload the standalone executable
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: PdfToDicom-exe-${{ matrix.rid }}
          # The versioned copy, so a downloaded file says which build it is without
          # anyone having to open its properties.
          path: artifacts/PdfToDicom-*-${{ matrix.rid }}.exe
          if-no-files-found: error
          retention-days: 7
